name: Backend CI

# Note: push/PR triggers are disabled until GitHub billing issue is resolved.
# Run manually from the Actions tab, or re-enable the triggers below.
on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  #   paths:
  #     - "backend/**"
  #     - ".github/workflows/backend.yml"
  # pull_request:
  #   branches: [main]
  #   paths:
  #     - "backend/**"

jobs:
  test:
    name: Python ${{ matrix.python-version }} — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11"]

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: backend/lambda/requirements.txt

      - name: Install system deps (rasterio, GDAL)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev gdal-bin

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r lambda/requirements.txt
          pip install pytest pytest-cov hypothesis

      - name: Run pytest
        env:
          SUPABASE_URL: "http://localhost:54321"
          SUPABASE_KEY: "test-key"
          AWS_REGION: "ap-southeast-1"
        run: pytest --tb=short --maxfail=5

      - name: Run property-based tests with coverage
        env:
          SUPABASE_URL: "http://localhost:54321"
          SUPABASE_KEY: "test-key"
        run: pytest --cov=lambda --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml

  lint:
    name: Lint (ruff + mypy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install ruff + mypy
        run: pip install ruff mypy

      - name: ruff
        run: ruff check lambda || true

      - name: mypy (non-blocking)
        run: mypy lambda --ignore-missing-imports || true
